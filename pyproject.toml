[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-inference-benchmark"
version = "0.1.0"
description = "Fair PyTorch, ONNX Runtime and TensorRT benchmark for Ultralytics YOLO"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["yolo_benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

